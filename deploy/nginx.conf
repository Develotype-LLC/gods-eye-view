server {
    listen 127.0.0.1:8080;
    server_name godseye.develotype.com landman.develotype.com;
    server_tokens off;
    auth_basic "LANDMAN'S Eye";
    auth_basic_user_file /etc/nginx/godseye-viewers.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { auth_basic off; default_type text/plain; return 200 "ok\n"; }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header X-Landman-User $remote_user;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
